<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNR Korea | Environmental & Energy Technologies</title>
  <meta name="description" content="CNR Korea environmental and energy technologies." />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: 100%;
      margin: 0 auto;
      background: #fff;
    }
    .slide {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
    .error-note {
      display: none;
      padding: 24px;
      text-align: center;
      color: #b00020;
      background: #fff3f3;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="page" id="slides"></main>
  <div class="error-note" id="errorNote">
    Some images could not be loaded. Please check the folder name and PNG file names in GitHub.
  </div>

  <script>
    const container = document.getElementById("slides");
    const errorNote = document.getElementById("errorNote");

    const folders = ["CNR_Korea website 2", "CNR Korea website 2"];

    function addSlide(n) {
      const img = document.createElement("img");
      img.className = "slide";
      img.alt = "CNR Korea Technology Slide " + n;
      img.loading = n <= 3 ? "eager" : "lazy";
      img.decoding = "async";

      let folderIndex = 0;

      function tryLoad() {
        img.src = folders[folderIndex] + "/슬라이드" + n + ".PNG";
      }

      img.onerror = function () {
        folderIndex++;
        if (folderIndex < folders.length) {
          tryLoad();
        } else {
          errorNote.style.display = "block";
          img.style.display = "none";
        }
      };

      container.appendChild(img);
      tryLoad();
    }

    for (let i = 1; i <= 17; i++) {
      addSlide(i);
    }
  </script>
</body>
</html>
